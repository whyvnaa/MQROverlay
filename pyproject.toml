[project]
name = "monkeyquest-overlay"
version = "0.1.0"
description = "Map overlay for the Monkey Quest (MQReborn) client: zone maps with enemies, chests, NPCs and search"
requires-python = ">=3.11"
dependencies = [
    "pyside6-essentials>=6.8",
]

[project.scripts]
mq-overlay = "mq_overlay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mq_overlay"]

# the exported data goes into the wheel, so `uvx --from git+... mq-overlay` runs without a clone
[tool.hatch.build.targets.wheel.force-include]
"data" = "mq_overlay/data"

[dependency-groups]
dev = ["pytest>=8"]
build = ["pytest>=8", "pyinstaller>=6.11"]  # tools/build_exe.py (the release zip)
