# A tag like v0.2.0 builds the Windows zip (tools/build_exe.py) and attaches it to a GitHub release of that tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the tests
        run: uv run --group build pytest -q
      - name: Build the installer and the zip
        run: uv run --group build tools/build_exe.py --version ${{ github.ref_name }} --installer
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mq-overlay-*-setup.exe
            dist/mq-overlay-${{ github.ref_name }}-win.zip
          body: |
            **mq-overlay-…-setup.exe**: the installer (no administrator needed): Start menu entry, desktop icon, uninstaller. Windows SmartScreen warns once about an unsigned program: "More info" → "Run anyway".
            **mq-overlay-…-win.zip**: the same program as a folder, for a USB stick or if you'd rather not install anything; run `mq-overlay.exe` inside it.
            For your position in the game and your character in the Build tab, install [Npcap](https://npcap.com/#download); the overlay explains the steps at start.
